<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
<script src="/assets/simulations/plot.js"></script>
<div id="plot" style="width:95vw;height:95vh; display: block;margin: 0;"></div>
<script>
// --- Load all three files in parallel for better performance ---
var xUrl = "./data/finalPolyEightVeryReduced_x.csv";
var yUrl = "./data/finalPolyEightVeryReduced_y.csv";
var zUrl = "./data/finalPolyEightVeryReduced_z.csv";

// Parallel loading with Promise.all
Promise.all([
  fetch(xUrl, { cache: "no-store" }).then(r => r.text()),
  fetch(yUrl, { cache: "no-store" }).then(r => r.text()),
  fetch(zUrl, { cache: "no-store" }).then(r => r.text())
])
.then(function([xText, yText, zText]) {
  var X = parseMatrix(xText);
  var Y = parseMatrix(yText);
  var Z = parseMatrix(zText);

  var frames = buildFrames(X, Y, Z);
  render("plot", frames, 20);
})
.catch(function(error) {
  console.error("Error loading data:", error);
});
</script>
